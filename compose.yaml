name: jobassistant

services:
  db:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_USER: jobassistant
      POSTGRES_PASSWORD: jobassistant
      POSTGRES_DB: jobassistant
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:54320:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U jobassistant -d jobassistant"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      target: app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: local
      DATABASE_URL: postgres://jobassistant:jobassistant@db:5432/jobassistant
      SECRETS_FILE: /data/secrets.env
    volumes:
      - appdata:/data
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  test:
    build:
      context: .
      target: test
    profiles: ["test"]

volumes:
  pgdata:
  appdata:
